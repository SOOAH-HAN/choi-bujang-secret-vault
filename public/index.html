<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li .body { display: block; color: #bfd0e5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .panel { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .panel p { margin: 0 0 12px; font-size: 16px; }
    .panel form, li form { display: grid; gap: 12px; }
    [hidden] { display: none !important; }
    label { display: grid; gap: 6px; font-size: 14px; color: #bfd0e5; }
    input, textarea { padding: 11px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font-size: 16px; font-family: inherit; }
    textarea { min-height: 84px; resize: vertical; }
    button { padding: 10px 16px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    button.quiet { background: #34495f; color: #ecf4ff; }
    button.danger { background: #d07384; color: #101a28; }
    button:disabled { opacity: .6; cursor: wait; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .message { margin: 12px 0 0; color: #ffb4c0; min-height: 1.4em; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인</div>
    <h1>점령된 자료실</h1>
    <p>서버가 로그인 토큰을 확인한 뒤에만 자료를 줍니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">로그인하지 않으면 자료가 보이지 않습니다. 아직 소유자 검사가 없어서, 로그인한 다른 사람이 메모 번호를 알면 고치거나 지울 수 있습니다. 이 허점은 다음 제작 단계에서 막습니다. 실제 개인정보는 넣지 마세요.</div>
    <section class="panel" id="auth">
      <p id="auth-status">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form" hidden autocomplete="off">
        <label>이메일 <input id="email" type="email" autocomplete="off" required></label>
        <label>비밀번호 <input id="password" type="password" autocomplete="off" required></label>
        <button type="submit" id="login-button">로그인</button>
      </form>
      <button type="button" id="logout-button" hidden>로그아웃</button>
      <p class="message" id="auth-error" role="alert"></p>
    </section>
    <section class="panel" id="editor" hidden>
      <form id="note-form">
        <label>제목 <input id="note-title" maxlength="200" required></label>
        <label>내용 <textarea id="note-body" maxlength="5000"></textarea></label>
        <button type="submit" id="note-add">메모 추가</button>
      </form>
      <p class="message" id="note-message" role="alert"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>로그인 상태를 확인하는 중입니다.</li></ul>
  </main>
  <script type="module">
    // Project URL과 publishable key는 공개용이라 화면 코드에 있어도 됩니다.
    // 서버 전용 비밀 키는 절대 이 파일에 넣지 않습니다.
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';
    const SUPABASE_URL = 'https://hvqrdvodayifquigyoyj.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_NO75wBvoxZqiuTNzf8Yduw_jHyx4KbU';

    const $ = (selector) => document.querySelector(selector);
    const status = $('#auth-status');
    const loginForm = $('#login-form');
    const loginButton = $('#login-button');
    const logoutButton = $('#logout-button');
    const errorBox = $('#auth-error');
    const editor = $('#editor');
    const noteForm = $('#note-form');
    const noteMessage = $('#note-message');
    const list = $('#notes');
    const REASONS = {
      invalid_credentials: '이메일 또는 비밀번호가 맞지 않습니다.',
      email_not_confirmed: '이메일 인증이 아직 끝나지 않았습니다.',
      validation_failed: '이메일 형식을 확인해 주세요.',
      over_request_rate_limit: '요청이 너무 많습니다. 잠시 뒤에 다시 시도해 주세요.',
    };
    const reasonOf = (error) => REASONS[error?.code] ?? error?.message ?? '알 수 없는 오류입니다.';
    const make = (tag, text, className) => {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    };
    const button = (text, className, onClick) => {
      const node = make('button', text, className);
      node.type = 'button';
      node.addEventListener('click', onClick);
      return node;
    };
    const message = (text) => make('li', text);

    // 로그인 토큰을 붙여 서버에 요청합니다. 브라우저는 사용자 ID나 역할을 보내지 않습니다.
    let token = null;
    async function api(method, path, payload) {
      if (!token) throw new Error('로그인이 필요합니다.');
      const response = await fetch(path, {
        method, cache: 'no-store',
        headers: { Authorization: `Bearer ${token}`, ...(payload ? { 'Content-Type': 'application/json' } : {}) },
        body: payload ? JSON.stringify(payload) : undefined,
      });
      if (response.status === 401) throw new Error('로그인이 확인되지 않았습니다. 다시 로그인해 주세요.');
      if (!response.ok) {
        let detail = '';
        try { detail = (await response.json()).message ?? ''; } catch { /* 본문 없음 */ }
        throw new Error(detail || `요청이 실패했습니다 (${response.status}).`);
      }
      return response.json();
    }

    function noteItem(note) {
      const item = make('li');
      const show = () => {
        const actions = make('div', undefined, 'actions');
        actions.append(button('수정', 'quiet', edit), button('삭제', 'danger', remove));
        item.replaceChildren(make('strong', note.title), make('span', note.body, 'body'), actions);
      };
      const edit = () => {
        const form = make('form');
        const title = make('input'); title.value = note.title; title.maxLength = 200; title.required = true;
        const body = make('textarea'); body.value = note.body; body.maxLength = 5000;
        const save = make('button', '저장'); save.type = 'submit';
        const label = (text, field) => { const l = make('label', text); l.append(field); return l; };
        const actions = make('div', undefined, 'actions');
        actions.append(save, button('취소', 'quiet', show));
        form.append(label('제목', title), label('내용', body), actions);
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          save.disabled = true;
          try {
            note = await api('PUT', `/api/notes/${encodeURIComponent(note.id)}`, { title: title.value, body: body.value });
            noteMessage.textContent = '';
            show();
          } catch (error) {
            noteMessage.textContent = `수정 실패: ${error.message}`;
            save.disabled = false;
          }
        });
        item.replaceChildren(form);
        title.focus();
      };
      const remove = async () => {
        if (!window.confirm('이 메모를 지울까요?')) return;
        try {
          await api('DELETE', `/api/notes/${encodeURIComponent(note.id)}`);
          noteMessage.textContent = '';
          await refresh(true);
        } catch (error) {
          noteMessage.textContent = `삭제 실패: ${error.message}`;
        }
      };
      show();
      return item;
    }

    // 토큰이 바뀐 때만 다시 읽습니다. 로그아웃하면 자료를 비웁니다.
    let loadedFor;
    async function refresh(force = false) {
      const current = token;
      if (!force && current === loadedFor) return;
      loadedFor = current;
      if (!current) {
        list.replaceChildren(message('로그인하면 가상 자료가 보입니다.'));
        return;
      }
      list.replaceChildren(message('가상 자료를 불러오는 중입니다.'));
      try {
        const notes = await api('GET', '/api/notes');
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (loadedFor !== current) return;
        list.replaceChildren(...(notes.length ? notes.map(noteItem) : [message('아직 메모가 없습니다. 위에서 추가해 보세요.')]));
      } catch (error) {
        if (loadedFor === current) list.replaceChildren(message(error.message));
      }
    }

    function showSession(session) {
      const loggedIn = Boolean(session?.user);
      token = session?.access_token ?? null;
      loginForm.hidden = loggedIn;
      logoutButton.hidden = !loggedIn;
      editor.hidden = !loggedIn;
      status.textContent = loggedIn ? `로그인됨: ${session.user.email}` : '로그아웃 상태입니다. 로그인해 주세요.';
      if (loggedIn) loginForm.reset(); else noteMessage.textContent = '';
      refresh();
    }

    try {
      const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      const { data } = await supabase.auth.getSession();
      showSession(data.session);
      supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_OUT') { loginForm.reset(); noteForm.reset(); }
        showSession(session);
      });

      loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.textContent = '';
        loginButton.disabled = true;
        const { error } = await supabase.auth.signInWithPassword({
          email: loginForm.elements.email.value.trim(),
          password: loginForm.elements.password.value,
        });
        loginButton.disabled = false;
        loginForm.elements.password.value = '';
        if (error) errorBox.textContent = `로그인 실패: ${reasonOf(error)}`;
      });

      logoutButton.addEventListener('click', async () => {
        errorBox.textContent = '';
        const { error } = await supabase.auth.signOut();
        if (error) errorBox.textContent = `로그아웃 실패: ${reasonOf(error)}`;
        else { loginForm.reset(); noteForm.reset(); }
      });

      noteForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        noteMessage.textContent = '';
        const add = $('#note-add');
        add.disabled = true;
        try {
          await api('POST', '/api/notes', { title: $('#note-title').value, body: $('#note-body').value });
          noteForm.reset();
          await refresh(true);
        } catch (error) {
          noteMessage.textContent = `추가 실패: ${error.message}`;
        }
        add.disabled = false;
      });
    } catch (error) {
      status.textContent = '로그인 기능을 불러오지 못했습니다.';
      errorBox.textContent = `이유: ${reasonOf(error)}`;
      list.replaceChildren(message('로그인 기능을 불러오지 못해 자료를 볼 수 없습니다.'));
    }
  </script>
</body>
</html>
