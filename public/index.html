<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth p { margin: 0 0 12px; font-size: 16px; }
    .auth form { display: grid; gap: 12px; }
    .auth [hidden] { display: none; }
    .auth label { display: grid; gap: 6px; font-size: 14px; color: #bfd0e5; }
    .auth input { padding: 11px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font-size: 16px; }
    .auth button { padding: 11px 16px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth .auth-error { margin: 12px 0 0; color: #ffb4c0; min-height: 1.4em; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인</div>
    <h1>점령된 자료실</h1>
    <p>서버가 로그인 토큰을 확인한 뒤에만 자료를 줍니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">로그인하지 않으면 자료가 보이지 않습니다. 로그인한 사람은 아직 모든 자료를 볼 수 있습니다. 남의 자료를 막는 소유자 검사는 다음 제작 단계에서 붙입니다.</div>
    <section class="auth" id="auth">
      <p id="auth-status">로그인 상태를 확인하는 중입니다.</p>
      <form id="login-form" hidden autocomplete="off">
        <label>이메일 <input id="email" type="email" autocomplete="off" required></label>
        <label>비밀번호 <input id="password" type="password" autocomplete="off" required></label>
        <button type="submit" id="login-button">로그인</button>
      </form>
      <button type="button" id="logout-button" hidden>로그아웃</button>
      <p class="auth-error" id="auth-error" role="alert"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>로그인 상태를 확인하는 중입니다.</li></ul>
  </main>
  <script type="module">
    // Project URL과 publishable key는 공개용이라 화면 코드에 있어도 됩니다.
    // 서버 전용 비밀 키는 절대 이 파일에 넣지 않습니다.
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';
    const SUPABASE_URL = 'https://hvqrdvodayifquigyoyj.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_NO75wBvoxZqiuTNzf8Yduw_jHyx4KbU';

    const status = document.querySelector('#auth-status');
    const form = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const errorBox = document.querySelector('#auth-error');
    const list = document.querySelector('#notes');
    const REASONS = {
      invalid_credentials: '이메일 또는 비밀번호가 맞지 않습니다.',
      email_not_confirmed: '이메일 인증이 아직 끝나지 않았습니다.',
      validation_failed: '이메일 형식을 확인해 주세요.',
      over_request_rate_limit: '요청이 너무 많습니다. 잠시 뒤에 다시 시도해 주세요.',
    };
    const reasonOf = (error) => REASONS[error?.code] ?? error?.message ?? '알 수 없는 오류입니다.';
    const message = (text) => {
      const item = document.createElement('li');
      item.textContent = text;
      return item;
    };

    // 로그인 토큰을 붙여 서버에 자료를 요청합니다. 토큰이 바뀐 때만 다시 읽습니다.
    let loadedFor;
    async function loadNotes(session) {
      const token = session?.access_token ?? null;
      if (token === loadedFor) return;
      loadedFor = token;
      if (!token) {
        list.replaceChildren(message('로그인하면 가상 자료가 보입니다.'));
        return;
      }
      list.replaceChildren(message('가상 자료를 불러오는 중입니다.'));
      try {
        const response = await fetch('/api/notes', {
          cache: 'no-store', headers: { Authorization: `Bearer ${token}` },
        });
        if (response.status === 401) throw new Error('로그인이 확인되지 않았습니다. 다시 로그인해 주세요.');
        if (!response.ok) throw new Error('자료를 읽을 수 없습니다.');
        const data = await response.json();
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (loadedFor !== token) return;
        list.replaceChildren(...data.notes.map((note) => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.content;
          item.append(title, content);
          return item;
        }));
      } catch (error) {
        if (loadedFor === token) list.replaceChildren(message(error.message));
      }
    }

    function showSession(session) {
      const loggedIn = Boolean(session?.user);
      form.hidden = loggedIn;
      logoutButton.hidden = !loggedIn;
      status.textContent = loggedIn ? `로그인됨: ${session.user.email}` : '로그아웃 상태입니다. 로그인해 주세요.';
      if (loggedIn) form.reset();
      loadNotes(session);
    }

    try {
      const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      const { data } = await supabase.auth.getSession();
      showSession(data.session);
      supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_OUT') form.reset();
        showSession(session);
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorBox.textContent = '';
        loginButton.disabled = true;
        const { error } = await supabase.auth.signInWithPassword({
          email: form.elements.email.value.trim(),
          password: form.elements.password.value,
        });
        loginButton.disabled = false;
        form.elements.password.value = '';
        if (error) errorBox.textContent = `로그인 실패: ${reasonOf(error)}`;
      });

      logoutButton.addEventListener('click', async () => {
        errorBox.textContent = '';
        const { error } = await supabase.auth.signOut();
        if (error) errorBox.textContent = `로그아웃 실패: ${reasonOf(error)}`;
        else form.reset();
      });
    } catch (error) {
      status.textContent = '로그인 기능을 불러오지 못했습니다.';
      errorBox.textContent = `이유: ${reasonOf(error)}`;
      list.replaceChildren(message('로그인 기능을 불러오지 못해 자료를 볼 수 없습니다.'));
    }
  </script>
</body>
</html>
